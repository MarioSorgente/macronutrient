name: CI

# Push only, deliberately. Adding `pull_request:` as well would run the whole
# job twice on the same commit whenever a PR is open — runs #14 and #15 both
# fired on 908f63c, three seconds apart. A push-triggered run still reports on
# the PR, because the check is attached to the head commit either way.
on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The fast gate: lint, types, unit tests and a production build.
#
# The emulated suite (rules, indexes, server logic) and the Playwright journeys
# are NOT here. They are the slow half — a JVM for the Firestore emulator and a
# Chromium download — and they run locally instead:
#
#   npm run test:emulated     # run this whenever firestore.rules changes
#   npm run e2e
#
# `firestore.rules` is the one to be careful about: nothing below covers it, and
# rules that are wrong deny every read in the app.
#
# What does stay covered here is src/lib/server/runtime.test.ts, which is part
# of the unit project. It guards the ERR_REQUIRE_ESM failure that took every API
# route down in production, so removing the `jose` pin from package.json still
# turns this red.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
